# docker compose up --build
#   API:       http://localhost:8000  (interactive docs at /docs)
#   Streamlit: http://localhost:8501
# Set API_KEY / APP_PASSWORD in a .env file (see .env.example) to require
# them; left empty, both services are open (local use only).
services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-}
      DATABASE_URL: sqlite:////data/ab_test_engine.db
    volumes:
      - ab-data:/data
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
    ports:
      - "8501:8501"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
    # The Streamlit app keeps one in-memory database per browser session by
    # design, so it does not need the API's volume. Each image defines its
    # own health check (Dockerfile).
    restart: unless-stopped

volumes:
  ab-data:
